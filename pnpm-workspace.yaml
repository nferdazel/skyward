# Root workspace pnpm untuk Skyward (arsitektur monorepo selaras dengan cbs/kran)
packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  'esbuild': true
  '@scarf/scarf': false

# Cooldown paket baru (menit): versi yang baru terbit tidak langsung boleh dipakai.
# Default pnpm 11 = 1440 (1 hari); dinaikkan ke 4320 (3 hari) sesuai kebijakan supply chain.
minimumReleaseAge: 4320
