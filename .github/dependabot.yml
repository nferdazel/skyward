version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns:
          - "svelte*"
          - "@sveltejs/*"
      tooling:
        patterns:
          - "vite"
          - "vitest"
          - "prettier*"
          - "eslint*"
          - "typescript*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
